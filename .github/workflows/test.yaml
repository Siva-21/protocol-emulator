name: test
on: [push, workflow_dispatch]

# A newer push to the same branch cancels the running workflow; never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Did this push touch the design or its flow? Heavy jobs below skip otherwise
  # (a skipped job counts as passing). On main and on manual runs they always run.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      design: ${{ steps.filter.outputs.design }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            design:
              - 'src/**'
              - 'test/**'
              - 'info.yaml'
              - 'scripts/**'
              - 'verification/docker/**'
              - '.github/workflows/**'

  test:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.design == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Verilator (RTL simulation) and Icarus from OSS CAD Suite, pinned to a dated
      # build. cocotb 2.x needs Verilator >= 5.036; this build has 5.055 (devel).
      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-10'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Verilator --trace-fst compiles the FST writer into the model: it needs the
      # lz4 and zlib headers/libraries, which OSS CAD Suite does not ship.
      - name: Install FST trace dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y liblz4-dev zlib1g-dev

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make -B
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
